          </div>

          {/* Paso 5: Firma Digital Táctil / Canvas del Operador */}
          <div className="bg-zinc-900/90 border border-slate-800 rounded-3xl p-7 sm:p-8 shadow-lg space-y-5">
            <div className="pb-3 border-b border-slate-800 space-y-1.5">
              <div className="flex items-center justify-between gap-3">
                <h3 className="text-lg font-bold text-white flex items-center gap-2.5 leading-none">

      {/* Historial Reciente de Checklists */}

        const reqList = activeItem.requisitos || [];

                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-lg bg-slate-900 border border-slate-800 font-mono text-xs font-bold text-amber-400">
                      {activeItem.id}

                    {activeItem.critico ? (
                      <span className="inline-flex items-center px-2.5 py-0.5 rounded-full bg-rose-600 text-white text-[11px] font-extrabold uppercase tracking-wider">

                    ) : (
                      <span className="inline-flex items-center px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 text-[11px] font-bold uppercase">
                        Estándar SST
                      </span>
                    )}
                    <span className="inline-flex items-center text-xs font-mono text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded-full border border-amber-500/20">
                      {activeItem.normativa}
                    </span>
                  </div>
                  <h3 className="text-lg sm:text-xl font-extrabold text-white leading-snug">
                    {activeItem.titulo}
                  </h3>
                </div>
                <button
                  type="button"
                  onClick={() => setOpenItemId(null)}

                  <X className="w-5 h-5 shrink-0" />
                </button>
              </div>

              {/* Cuerpo del Modal */}
              <div className="p-6 overflow-y-auto flex-1 space-y-5">
                {activeItem.exigenciaLegal && (
                  <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-slate-300 leading-relaxed">
                    <div className="font-bold text-amber-400 uppercase tracking-wider mb-1">
                      Exigencia Establecida por la Normativa ({activeItem.normativa}):
                    </div>
                    {activeItem.exigenciaLegal}
                  </div>
                )}

                <div className="flex flex-wrap items-center justify-between gap-3">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-300">
                    Verificación de Requisitos Técnicos ({completedCount}/{reqList.length} cumplidos):
                  </span>
                  <div className="flex items-center gap-2">

                      type="button"
                      onClick={() => handleMarkItemConforme(activeItem)}

                    >
                      Marcar Todo Cumple

                    <button
                      type="button"
                      onClick={() => handleMarkItemNoConforme(activeItem)}
                      className="inline-flex items-center justify-center px-3.5 py-1.5 rounded-full bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 text-xs font-bold"
                    >
                      Reportar Incumplimiento
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  {reqList.map((req) => {
                    const checked = !!subChecks[req.id];
                    return (
                      <div
                        key={req.id}

                        className={`flex items-center justify-between gap-4 p-4 rounded-2xl border-2 cursor-pointer transition-all ${
                          checked
                            ? 'bg-emerald-950/20 border-emerald-500/50 text-slate-100'
                            : 'bg-rose-950/30 border-rose-500 text-rose-100'
                        }`}
                      >
                        <div className="flex items-center gap-3.5 flex-1 min-w-0">

                            className={`w-7 h-7 rounded-xl flex items-center justify-center shrink-0 font-bold text-xs transition-all ${
                              checked
                                ? 'bg-emerald-500 text-slate-950'

                          >

                          </div>
                          <div className="text-xs sm:text-sm leading-snug flex-1">

                                const next = { ...prev, [req.id]: true };
                                const allMet = (activeItem.requisitos || []).every((r) => next[r.id]);
                                setAnswers((prevAns) => ({
                                  ...prevAns,
                                  [activeItem.id]: allMet ? 'CONFORME' : 'NO_CONFORME'
                                }));
                                return next;
                              });
                            }}
                            className={`inline-flex items-center justify-center px-3.5 py-2 rounded-full text-xs font-extrabold transition-all whitespace-nowrap ${
                              checked
                                ? 'bg-emerald-600 text-white shadow-md'
                                : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-white'
                            }`}
                          >
                            Cumple
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              setSubChecks((prev) => {
                                const next = { ...prev, [req.id]: false };
                                setAnswers((prevAns) => ({
                                  ...prevAns,
                                  [activeItem.id]: 'NO_CONFORME'
                                }));
                                return next;
                              });
                            }}
                            className={`inline-flex items-center justify-center px-3.5 py-2 rounded-full text-xs font-extrabold transition-all whitespace-nowrap ${
                              !checked
                                ? 'bg-rose-600 text-white shadow-md'
                                : 'bg-slate-900 text-slate-400 border border-slate-800 hover:text-white'
                            }`}
                          >
                            No Cumple
                          </button>
                        </div>
                      </div>
                    );
                  })}

                {/* Resumen del estado resultante */}
                <div
                  className={`p-4 rounded-2xl border text-xs flex items-center justify-between gap-3 ${
                    allReqsMet
                      ? 'bg-emerald-950/20 border-emerald-500/30 text-emerald-300'

                  <div>
                    <strong className="block text-sm font-extrabold">
                      Resultado del Punto {activeItem.id}:{' '}

                    <span className="text-slate-300">

                  <span>Confirmar Inspección ({allReqsMet ? 'Conforme' : 'No Conforme'})</span>
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* MODAL DE BLOQUEO AUTOMÁTICO LOTO & ORDEN DE TRABAJO */}

            <div className="p-6 bg-slate-950 border-b border-rose-500/40 flex items-center justify-between gap-3 shrink-0">

                <div className="p-3 rounded-2xl bg-rose-600 text-white shadow-lg">
                  <Lock className="w-6 h-6" />
                </div>
                <div>
                  <span className="text-xs font-mono font-extrabold uppercase tracking-wider text-rose-400">

                  <h3 className="text-xl font-extrabold text-white">

              </p>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                <div>
                  <div className="text-xs text-slate-400">Activo Bloqueado</div>

                </div>

                  <div className="text-xs text-slate-400">Operador Reportante</div>

                </div>
                <div>
                  <div className="text-xs text-slate-400">Código Candado LOTO Generado</div>
                  <div className="font-mono font-extrabold text-rose-400 text-base">
                    {lockoutModalData.lotoCode}
                  </div>
                </div>
                <div>
                  <div className="text-xs text-slate-400">Orden de Trabajo Mantenimiento</div>
                  <div className="font-mono font-extrabold text-amber-400 text-base">
                    {lockoutModalData.workOrder}
                  </div>
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-rose-950/20 border border-rose-500/40">
                <div className="text-xs font-bold text-rose-400 uppercase mb-1.5">
                  No Conformidades Críticas Detectadas:
                </div>
                <ul className="list-disc list-inside text-xs text-slate-300 space-y-1">
                  {lockoutModalData.failures.map((f) => (
                    <li key={f.id}>
                      <strong>{f.titulo}</strong> ({f.normativa})
                    </li>
                  ))}
                </ul>
              </div>
            </div>

            <div className="p-5 bg-slate-950 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3 shrink-0">
              <button
                type="button"
                onClick={() => setLockoutModalData(null)}
                className="px-4 py-2.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
              >
                Cerrar Aviso
              </button>
              <div className="flex flex-wrap items-center gap-2.5">
                <button
                  type="button"
                  onClick={() => {
                    setLockoutModalData(null);
                    setActiveTab('iot');
                  }}
                  className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition-all"
                >
                  Ver Alerta IoT
                  <ArrowRight className="w-3.5 h-3.5" />
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setLockoutModalData(null);
                    setActiveTab('loto');
                  }}
                  className="inline-flex items-center gap-1.5 px-5 py-2.5 rounded-full bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition-all"
                >
                  <Wrench className="w-3.5 h-3.5" />
                  Ir a Liberación LOTO
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

    { id: 'Físico', icon: Zap, desc: 'Ruido, iluminación, temperatura, piso resbaladizo' },
    { id: 'Químico', icon: Flame, desc: 'Gases CO, vapores, aceites, solventes' },
    { id: 'Ergonómico', icon: Activity, desc: 'Posturas forzadas, cargas, vibración' },
    { id: 'Mecánico', icon: Wrench, desc: 'Atrapamiento, cables expuestos, alta presión' },
    { id: 'Psicosocial', icon: Brain, desc: 'Fatiga de turno, sobrecarga operativa' }
  ];

  const quickPresets = [
    {
      label: 'Derrame de Aceite en Taller',
      condicion: 'Piso resbaladizo por derrame de aceite hidráulico ISO VG 68 en pasillo de taller',
      categoria: 'Físico',
      ubicacion: 'Área de Taller — Nave Principal SD',
      probabilidad: 3,
      consecuencia: 2,
      accion: 'Confinamiento con kit antiderrame, limpieza desengrasante industrial y señalización.'
    },
    {
      label: 'Cable Trifásico 220V Expuesto',
      condicion: 'Cable eléctrico de 220V con aislamiento roto expuesto a paso de maquinaria en taller',
      categoria: 'Mecánico',
      ubicacion: 'Área de Taller — Zona de Soldadura',
      probabilidad: 3,
      consecuencia: 3,
      accion: 'Corte inmediato de energía en breaker principal, bloqueo LOTO eléctrico y reemplazo de línea.'
    },
    {
      label: 'Falta de EPP Auditivo (>85 dB)',
      condicion: 'Operador auxiliar en área de demolición sin protectores auditivos (>85 dB) ni lentes',
      categoria: 'Físico',
      ubicacion: 'Frente de Obra Punta Cana',
      probabilidad: 2,
      consecuencia: 2,
      accion: 'Detención preventiva de tarea, entrega de EPP certificado (Art. 4.1 Reg. 522-06) y charla 5 min.'
    },
    {
      label: 'Vibración Anormal en Brazo',
      condicion: 'Vibración anormal (>7.2 mm/s) en acoplamiento de brazo hidráulico de excavadora',
      categoria: 'Ergonómico',
      ubicacion: 'Patio de Máquinas Pesadas',
      probabilidad: 3,
      consecuencia: 3,
      accion: 'Parada inmediata del activo, inspección de bujes/pasadores y diagnóstico de bomba hidráulica.'
    }
  ];

  // Cálculo dinámico de Nivel de Riesgo (Matriz 3x3 Severidad x Probabilidad)
  const riskScore = probabilidad * consecuencia;
  const getRiskEvaluation = (score) => {
    if (score <= 2) {
      return {
        nivel: 'Riesgo Aceptable',
        colorClass: 'bg-emerald-950/20 text-emerald-300 border-emerald-500/40',
        badgeBg: 'bg-emerald-600 text-white',
        mensaje: 'Riesgo controlado. Mantener monitoreo rutinario y controles actuales.'
      };
    }
    if (score <= 4) {
      return {
        nivel: 'Riesgo Moderado',
        colorClass: 'bg-amber-950/25 text-amber-300 border-amber-500/40',
        badgeBg: 'bg-amber-500 text-slate-950',
        mensaje: 'Requiere acción correctiva programada con fecha límite (SLA) y supervisión HSE.'
      };
    }
    return {
      nivel: 'Riesgo Crítico / Inadmisible',
      colorClass: 'bg-rose-950/25 text-rose-300 border-rose-500/60',
      badgeBg: 'bg-rose-600 text-white',
      mensaje: 'REQUIERE PARADA INMEDIATA DE LA TAREA (STOP-WORK). No reanudar hasta mitigar el peligro.'
    };
  };

  const currentEval = getRiskEvaluation(riskScore);

  const handlePhotoUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      setCustomPhoto(ev.target.result);
    };
    reader.readAsDataURL(file);
  };

  const handleSubmitRisk = (e) => {
    e.preventDefault();
    const newId = `RSK-2026-${Math.floor(110 + Math.random() * 889)}`;
    const nowStr = new Date().toLocaleString('es-DO', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });

    const newReport = {
      id: newId,
      fecha: nowStr,
      reportadoPor,
      condicion,
      categoria,
      ubicacion,
      probabilidad,
      consecuencia,
      score: riskScore,
      nivel: currentEval.nivel,
      accionCorrectiva,
      responsable,
      slaFecha,
      estado: riskScore >= 6 ? 'PARADA INMEDIATA ACTIVA' : 'Abierto',
      customPhoto
    };

    setRiskReports((prev) => [newReport, ...prev]);

    // Si es riesgo crítico y se seleccionó una máquina afectada, bloquearla por LOTO
    if (riskScore >= 6 && maquinaAfectadaId !== 'NINGUNA') {
      const lotoCode = `LOTO-2026-RSK-${Math.floor(1000 + Math.random() * 8999)}`;
      const workOrder = `OT-MANT-2026-${Math.floor(1000 + Math.random() * 8999)}`;
      setMachines((prev) =>
        prev.map((m) =>
          m.id === maquinaAfectadaId
            ? {
                ...m,
                estado: 'BLOQUEADO_LOTO',
                lotoCode,
                workOrder,
                motivoBloqueo: `Reporte de Riesgo Crítico (${newId}): ${condicion}`,
                fechaBloqueo: nowStr
              }
            : m
        )
      );
      addNotification(
        `Riesgo Crítico + Bloqueo LOTO (${maquinaAfectadaId})`,
        `Se registró ${newId} y se bloqueó la unidad ${maquinaAfectadaId} con código ${lotoCode}.`,
        'critical',
        'loto'
      );
    } else {
      addNotification(
        `Reporte de Riesgo Registrado (${newId})`,
        `Clasificación: ${currentEval.nivel} (Puntaje ${riskScore}/9). Asignado a ${responsable}.`,
        riskScore >= 6 ? 'critical' : 'info',
        'riesgos'
      );
    }

    setIsNewModalOpen(false);
  };

  const handleToggleStatus = (id) => {
    setRiskReports((prev) =>
      prev.map((r) => {
        if (r.id !== id) return r;
        const nextStatus =
          r.estado === 'Abierto' || r.estado === 'PARADA INMEDIATA ACTIVA'
            ? 'En Mitigación'
            : r.estado === 'En Mitigación'
            ? 'Cerrado / Verificado'
            : 'Abierto';
        return { ...r, estado: nextStatus };
      })
    );
  };

  const filteredReports =
    filterCategory === 'TODOS'
      ? riskReports
      : riskReports.filter((r) => r.categoria === filterCategory);

  const openReportsCount = riskReports.filter((r) => r.estado !== 'Cerrado / Verificado').length;
  const criticalReportsCount = riskReports.filter((r) => r.score >= 6 && r.estado !== 'Cerrado / Verificado').length;
  const closedReportsCount = riskReports.filter((r) => r.estado === 'Cerrado / Verificado').length;

  return (
    <div className="space-y-6">
      {/* Encabezado Principal Limpio y Directo */}
      <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-zinc-900 via-slate-900 to-zinc-900 border border-slate-800 p-6 sm:p-8 shadow-xl">
        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-5">
          <div className="space-y-2">
            <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold">
              <AlertTriangle className="w-3.5 h-3.5 shrink-0" />
              <span>IDENTIFICACIÓN DE PELIGROS Y MATRIZ DE RIESGO (ISO 45001)</span>
            </div>
            <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
              Control de Riesgos en Planta y Frentes de Obra
            </h1>
            <p className="text-slate-400 text-sm max-w-2xl leading-relaxed">
              Consulte los peligros reportados en taller y obra, verifique qué medida correctiva se aplicó, actualice su estado o registre un nuevo hallazgo con cálculo automático de riesgo.
            </p>
          </div>

          <div className="flex flex-wrap items-center gap-3 shrink-0">
            <button
              type="button"
              onClick={() => setIsNewModalOpen(true)}
              className="inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-full bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold shadow-lg transition-all whitespace-nowrap"
            >
              <PlusCircle className="w-4 h-4 shrink-0" />
              <span>Reportar Nuevo Peligro</span>
            </button>
          </div>
        </div>
      </div>

      {/* 3 Tarjetas de Resumen Rápido */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
        <div className="bg-zinc-900/90 border border-slate-800 rounded-3xl p-5 shadow-md flex items-center justify-between">
          <div>
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">
              Peligros Activos en Seguimiento
            </span>
            <span className="text-2xl font-extrabold text-white font-mono mt-1 block">
              {openReportsCount}
            </span>
          </div>
          <span className="px-3 py-1 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30 text-xs font-bold">
            En Planta / Obra
          </span>
        </div>

        <div className="bg-zinc-900/90 border border-slate-800 rounded-3xl p-5 shadow-md flex items-center justify-between">
          <div>
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">
              Riesgos Críticos (Stop-Work)
            </span>
            <span className="text-2xl font-extrabold text-rose-400 font-mono mt-1 block">
              {criticalReportsCount}
            </span>
          </div>
          <span className="px-3 py-1 rounded-full bg-rose-600 text-white text-xs font-extrabold">
            Prioridad Alta
          </span>
        </div>

        <div className="bg-zinc-900/90 border border-slate-800 rounded-3xl p-5 shadow-md flex items-center justify-between">
          <div>
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">
              Hallazgos Mitigados y Cerrados
            </span>
            <span className="text-2xl font-extrabold text-emerald-400 font-mono mt-1 block">
              {closedReportsCount}
            </span>
          </div>
          <span className="px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 text-xs font-bold">
            Verificados HSE
          </span>
        </div>
      </div>

      {/* Listado Principal de Reportes de Riesgo (Limpio y Fácil de Usar) */}
      <div className="bg-zinc-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-lg space-y-6">
        <div className="pb-4 border-b border-slate-800 space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-4">
            <h2 className="text-lg font-bold text-white flex items-center gap-2.5 leading-none">
              <CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" />
              <span>Bitácora de Peligros Reportados y Plan de Mitigación (SLA)</span>
            </h2>

            {/* Filtro simple por categoría */}
            <div className="flex flex-wrap items-center gap-2">
              {['TODOS', 'Físico', 'Mecánico', 'Químico', 'Ergonómico', 'Psicosocial'].map((cat) => (
                <button
                  key={cat}
                  type="button"
                  onClick={() => setFilterCategory(cat)}
                  className={`inline-flex items-center justify-center px-3.5 py-1.5 rounded-full text-xs font-bold transition-all ${
                    filterCategory === cat
                      ? 'bg-emerald-600 text-white shadow-sm'
                      : 'bg-slate-950 text-slate-400 border border-slate-800 hover:text-white'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>
          <p className="text-xs text-slate-400">
            Haga clic en el botón de estado de cualquier tarjeta para avanzar su proceso (<strong>Abierto → En Mitigación → Cerrado</strong>) o en <strong>Ver Evaluación</strong> para consultar su ficha completa.
          </p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          {filteredReports.map((report) => {
            const isCrit = report.score >= 6;
            const isMod = report.score >= 3 && report.score <= 4;
            const isClosed = report.estado === 'Cerrado / Verificado';

            return (
              <div
                key={report.id}
                className={`p-6 rounded-3xl border-2 flex flex-col justify-between transition-all ${
                  isCrit && !isClosed
                    ? 'bg-rose-950/20 border-rose-500/60 shadow-lg'
                    : 'bg-slate-950/90 border-slate-800'
                }`}
              >
                <div className="space-y-3">
                  {/* Fila superior de etiquetas alineadas */}
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="flex items-center gap-2">
                      <span className="inline-flex items-center px-2.5 py-0.5 rounded-lg bg-zinc-900 border border-slate-800 font-mono text-xs font-bold text-amber-400">
                        {report.id}
                      </span>
                      <span className="inline-flex items-center px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-200 text-[11px] font-bold uppercase">
                        Riesgo {report.categoria}
                      </span>
                    </div>

                    <span
                      className={`inline-flex items-center px-3 py-0.5 rounded-full text-[11px] font-extrabold ${
                        isCrit
                          ? 'bg-rose-600 text-white'
                          : isMod
                          ? 'bg-amber-500 text-slate-950'
                          : 'bg-emerald-600 text-white'
                      }`}
                    >
                      {report.nivel} ({report.score}/9)
                    </span>
                  </div>

                  {/* Descripción del hallazgo */}
                  <div>
                    <h3 className="text-base font-extrabold text-white leading-snug">
                      {report.condicion}
                    </h3>
                    <p className="text-xs text-slate-400 mt-1">
                      Ubicación: <strong>{report.ubicacion}</strong> • Reportado por: {report.reportadoPor}
                    </p>
                  </div>

                  {/* Medida correctiva y responsable */}
                  <div className="p-3.5 rounded-2xl bg-zinc-900 border border-slate-800 text-xs space-y-1.5">
                    <div className="font-bold text-amber-400 uppercase tracking-wider text-[11px]">
                      Medida Correctiva Asignada:
                    </div>
                    <p className="text-slate-200 leading-relaxed">{report.accionCorrectiva}</p>
                    <div className="pt-2 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-400 font-mono">
                      <span>Responsable: {report.responsable}</span>
                      <span>Fecha Límite (SLA): {report.slaFecha}</span>
                    </div>
                  </div>
                </div>

                {/* Pie de la tarjeta con botones alineados */}
                <div className="mt-4 pt-3.5 border-t border-slate-800 flex flex-wrap items-center justify-between gap-3">
                  <button
                    type="button"
                    onClick={() => setSelectedReport(report)}
                    className="inline-flex items-center justify-center px-3.5 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition-all"
                  >
                    Ver Evaluación (P{report.probabilidad} × C{report.consecuencia})
                  </button>

                  <button
                    type="button"
                    onClick={() => handleToggleStatus(report.id)}
                    className={`inline-flex items-center justify-center px-4 py-1.5 rounded-full text-xs font-extrabold transition-all shadow-sm ${
                      report.estado === 'Cerrado / Verificado'
                        ? 'bg-emerald-600 text-white'
                        : report.estado === 'En Mitigación'
                        ? 'bg-amber-500 text-slate-950'
                        : 'bg-rose-600 text-white'
                    }`}
                  >
                    Estado: {report.estado} (Cambiar)
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* MODAL 1: FORMULARIO PARA REPORTAR UN NUEVO PELIGRO Y CALCULAR SU RIESGO */}
      {isNewModalOpen && (
        <div
          onClick={() => setIsNewModalOpen(false)}
          className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-zinc-900 border-2 border-slate-800 rounded-3xl max-w-3xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl"
          >
            {/* Encabezado del Modal */}
            <div className="p-6 bg-slate-950 border-b border-slate-800 flex items-center justify-between gap-4 shrink-0">
              <div>
                <span className="text-xs font-mono font-bold uppercase tracking-wider text-amber-400 block">
                  NUEVO REGISTRO HSE • ISO 45001 CLÁUSULA 6.1.2
                </span>
                <h3 className="text-xl font-extrabold text-white mt-0.5">
                  Reportar Condición Insegura y Evaluar Nivel de Riesgo
                </h3>
              </div>
              <button
                type="button"
                onClick={() => setIsNewModalOpen(false)}
                className="inline-flex items-center justify-center p-2.5 rounded-full bg-slate-800 text-slate-400 hover:text-white shrink-0"
              >
                <X className="w-5 h-5 shrink-0" />
              </button>
            </div>

            {/* Cuerpo del Modal con pasos claros */}
            <form onSubmit={handleSubmitRisk} className="p-6 overflow-y-auto flex-1 space-y-5">
              {/* Atajos rápidos de casos reales */}
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">
                  Plantillas Rápidas de Casos Frecuentes en TECTROMAQ (Opcional):
                </span>
                <div className="flex flex-wrap items-center gap-2">
                  {quickPresets.map((preset, idx) => (
                    <button
                      key={idx}
                      type="button"
                      onClick={() => {
                        setCondicion(preset.condicion);
                        setCategoria(preset.categoria);
                        setUbicacion(preset.ubicacion);
                        setProbabilidad(preset.probabilidad);
                        setConsecuencia(preset.consecuencia);
                        setAccionCorrectiva(preset.accion);
                      }}
                      className="inline-flex items-center justify-center px-3.5 py-1.5 rounded-full bg-slate-950 hover:bg-slate-800 border border-slate-800 text-xs font-bold text-slate-200 transition-all"
                    >
                      {preset.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Paso 1: Qué ocurre y dónde */}
              <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-4">
                <div className="text-xs font-extrabold uppercase tracking-wider text-amber-400">
                  Paso 1: Datos del Peligro Detectado
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                  {categories.map((cat) => {
                    const active = categoria === cat.id;
                    return (
                      <button
                        key={cat.id}
                        type="button"
                        onClick={() => setCategoria(cat.id)}
                        className={`p-2.5 rounded-xl border text-center transition-all ${
                          active
                            ? 'bg-emerald-600 text-white border-emerald-600 font-extrabold shadow-sm'
                            : 'bg-zinc-900 border-slate-800 text-slate-300 font-semibold'
                        }`}
                      >
                        <div className="text-xs">{cat.id}</div>
                      </button>
                    );
                  })}
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1.5">
                    Descripción del Peligro o Condición Insegura *
                  </label>
                  <textarea
                    rows={2}
                    required
                    value={condicion}
                    onChange={(e) => setCondicion(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">
                      Ubicación en Planta u Obra *
                    </label>
                    <select
                      value={ubicacion}
                      onChange={(e) => setUbicacion(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                    >
                      <option value="Área de Taller — Nave Principal SD">Área de Taller — Nave Principal SD</option>
                      <option value="Área de Taller — Zona de Soldadura">Área de Taller — Zona de Soldadura</option>
                      <option value="Patio de Máquinas Pesadas">Patio de Máquinas Pesadas</option>
                      <option value="Almacén Central de Lubricantes">Almacén Central de Lubricantes</option>
                      <option value="Frente de Obra Punta Cana">Frente de Obra Punta Cana</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">
                      Reportado Por *
                    </label>
                    <input
                      type="text"
                      required
                      value={reportadoPor}
                      onChange={(e) => setReportadoPor(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white"
                    />
                  </div>
                </div>
              </div>

              {/* Paso 2: Evaluación Simple por Botones (Probabilidad x Consecuencia) */}
              <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-4">
                <div className="text-xs font-extrabold uppercase tracking-wider text-amber-400">
                  Paso 2: Nivel de Riesgo (Probabilidad × Consecuencia)
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-2">
                      1. Probabilidad de que ocurra un accidente:
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { val: 1, label: 'Baja (1)' },
                        { val: 2, label: 'Media (2)' },
                        { val: 3, label: 'Alta (3)' }
                      ].map((opt) => (
                        <button
                          key={opt.val}
                          type="button"
                          onClick={() => setProbabilidad(opt.val)}
                          className={`py-2 px-3 rounded-xl text-xs font-bold border transition-all ${
                            probabilidad === opt.val
                              ? 'bg-amber-500 text-slate-950 border-amber-500 shadow-sm'
                              : 'bg-zinc-900 border-slate-800 text-slate-300'
                          }`}
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-2">
                      2. Gravedad del daño (Consecuencia):
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { val: 1, label: 'Leve (1)' },
                        { val: 2, label: 'Grave (2)' },
                        { val: 3, label: 'Fatal (3)' }
                      ].map((opt) => (
                        <button
                          key={opt.val}
                          type="button"
                          onClick={() => setConsecuencia(opt.val)}
                          className={`py-2 px-3 rounded-xl text-xs font-bold border transition-all ${
                            consecuencia === opt.val
                              ? 'bg-rose-600 text-white border-rose-600 shadow-sm'
                              : 'bg-zinc-900 border-slate-800 text-slate-300'
                          }`}
                        >
                          {opt.label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Resultado automático claro */}
                <div className={`p-3.5 rounded-xl border flex flex-wrap items-center justify-between gap-3 ${currentEval.colorClass}`}>
                  <div>
                    <div className="text-xs font-extrabold uppercase">
                      Resultado: {currentEval.nivel} (Puntaje: {probabilidad} × {consecuencia} = {riskScore} de 9)
                    </div>
                    <p className="text-xs mt-0.5">{currentEval.mensaje}</p>
                  </div>

function Module6Loto({
  machines,

  const lockedMachines = machines.filter((m) => m.estado === 'BLOQUEADO_LOTO');
  const [selectedLockedId, setSelectedLockedId] = useState(
    lockedMachines[0]?.id || ''
  );

  // Sincronizar selección cuando cambie la lista de bloqueadas
  useEffect(() => {
    if (lockedMachines.length > 0 && !lockedMachines.some((m) => m.id === selectedLockedId)) {
      setSelectedLockedId(lockedMachines[0].id);
    } else if (lockedMachines.length === 0) {
      setSelectedLockedId('');
    }
  }, [machines]);

  const currentLockedMachine = lockedMachines.find((m) => m.id === selectedLockedId);

  // Estado del modal de liberación
  const [isReleaseModalOpen, setIsReleaseModalOpen] = useState(false);

  // Doble Aprobación (Mantenimiento Técnico + Supervisor HSE)
  const [firmaMantenimiento, setFirmaMantenimiento] = useState(
    'Ing. Marcos Tejada (Jefe Mantenimiento Mecánico)'
  );
  const [aprobadoMantenimiento, setAprobadoMantenimiento] = useState(false);

  const [firmaHSE, setFirmaHSE] = useState(
    'Ing. Laura Báez (Supervisor Senior HSE)'
  );
  const [aprobadoHSE, setAprobadoHSE] = useState(false);

  // 3 Verificaciones obligatorias
  const [checks, setChecks] = useState({
    piezaReemplazada: false,
    retiroCandado: false,
    pruebaFrenos: false
  });

  const [notasTecnicasLiberacion, setNotasTecnicasLiberacion] = useState(

    checks.piezaReemplazada &&

    setChecks({
      piezaReemplazada: true,

    });
    setAprobadoMantenimiento(true);
    setAprobadoHSE(true);

  const handleConfirmRelease = (e) => {
    if (e) e.preventDefault();
    if (!currentLockedMachine || !allChecksComplete) return;

    const releaseTimestamp = new Date().toLocaleString('es-DO', {

    setMachines((prev) =>

        if (m.id === currentLockedMachine.id) {

        }

    });

    setAprobadoHSE(false);

function resolveInitialPage() {
  if (typeof window === 'undefined') return 'home';
  if (window.__INITIAL_PAGE__ && PAGE_ROUTES[window.__INITIAL_PAGE__]) {
    return window.__INITIAL_PAGE__;
  }
  const path = window.location.pathname.toLowerCase();
  if (path.includes('normativa')) return 'normativa';
  if (path.includes('inspecciones')) return 'inspecciones';
  if (path.includes('riesgos')) return 'riesgos';
  if (path.includes('monitoreo')) return 'monitoreo';
  if (path.includes('capacitacion')) return 'capacitacion';
  if (path.includes('liberacion-loto') || path.includes('loto')) return 'loto';
  return 'home';
}

                                </span>
                                <span className="altgage-serif text-2xl font-bold">0{activeItem.id + 1}</span>
                              </div>

                              <div className="my-6 space-y-2.5">
                                <div
                                  className="p-3 rounded-2xl flex items-center gap-3"
                                  style={{ backgroundColor: 'rgba(255, 255, 255, 0.92)', color: 'var(--color-dark)'}}

                                  <CheckCircle2 className="w-5 h-5 shrink-0" style={{ color: '#118d70'}} />
                                  <span className="text-xs font-bold">Paso 1: Selección guiada con 1 clic</span>
                                </div>
                                <div
                                  className="p-3 rounded-2xl flex items-center gap-3"
                                  style={{ backgroundColor: 'rgba(255, 255, 255, 0.92)', color: 'var(--color-dark)'}}

                                </div>
                              </div>

                              <div className="text-xs opacity-90 font-medium">
                                {activeItem.note}
                              </div>
                            </div>
                          </div>

                          <div className="lg:col-span-7 space-y-5">
                            <h2
                              className="altgage-serif"
                              style={{
                                fontSize: 'clamp(2rem, 3.6vw, 3.1rem)',
                                color: activeItem.theme === 'orange'? 'var(--color-dark)': '#ffffff'}}

                              {activeItem.title}
                            </h2>

                            <ul className="space-y-3 pl-1">
                              {activeItem.bullets.map((b, i) => (
                                <li key={i} className="flex items-start gap-3 text-base sm:text-lg font-medium">
                                  <span
                                    className="w-2.5 h-2.5 rounded-full mt-2 shrink-0"
                                    style={{
                                      backgroundColor:
                                        activeItem.theme === 'orange'? 'var(--color-dark)': 'var(--color-primary-400)'}}

                                  <span>{b}</span>
                                </li>
                              ))}
                            </ul>

                            <div className="pt-2">
                              <AltgageButton
                                theme={activeItem.btnTheme}
                                onClick={() => navigateToPage(activeItem.targetPage)}
                              >
                                <span>{activeItem.ctaText}</span>
                                <ArrowRight className="w-4 h-4" />
                              </AltgageButton>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* Barra de Navegación Draw-Nav con Elipses Dibujadas a Mano (Idéntica a Altgage) */}
                      <div className="mt-8 max-w-3xl mx-auto">
                        <div className="draw-nav">
                          <button
                            type="button"
                            onClick={() =>
                              setActiveStackIndex(
                                (prev) => (prev - 1 + ALTGAGE_STACK_ITEMS.length) % ALTGAGE_STACK_ITEMS.length
                              )
                            }
                            className="draw-nav-toggle"
                            title="Anterior"
                          >

                              <path d="M0.390381 9.81982L23.1895 9.81982" stroke="currentColor" strokeWidth="2" />
                              <path d="M13.8884 18.6519L23.5236 9.81961L13.8884 0.953915" stroke="currentColor" strokeWidth="2" />
                            </svg>
                          </button>

                          <div className="draw-nav-select">
                            {ALTGAGE_STACK_ITEMS.map((item, idx) => (
                              <button
                                key={item.id}
                                type="button"
                                data-active={activeStackIndex === idx ? 'true' : 'false'}
                                data-theme={item.theme}
                                onClick={() => setActiveStackIndex(idx)}
                                className="draw-nav-select-btn"
                              >
                                <span className="relative z-10">{item.tabLabel}</span>
                              </button>
                            ))}
                          </div>

                          <button
                            type="button"
                            onClick={() =>
                              setActiveStackIndex((prev) => (prev + 1) % ALTGAGE_STACK_ITEMS.length)
                            }
                            className="draw-nav-toggle"
                            title="Siguiente"
                          >
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" viewBox="0 0 25 20" fill="none">
                              <path d="M0.390381 9.81982L23.1895 9.81982" stroke="currentColor" strokeWidth="2" />
                              <path d="M13.8884 18.6519L23.5236 9.81961L13.8884 0.953915" stroke="currentColor" strokeWidth="2" />
                            </svg>
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            </section>

            {/* ---------------------------------------------------------------
                SECCIÓN 3: MARQUESINA GIGANTE ANIMADA ALTGAGE
                --------------------------------------------------------------- */}
            <section
              className="py-12 relative overflow-hidden"
              style={{
                backgroundColor: '#ffffff',
                borderTopLeftRadius: '3rem',
                borderTopRightRadius: '3rem'}}
            >
              <div className="altgage-marquee-wrap py-2">
                <div className="altgage-marquee-track items-center">
                  {[1, 2, 3, 4].map((n) => (
                    <div key={n} className="flex items-center">
                      <span
                        className="altgage-serif px-6 whitespace-nowrap"
                        style={{
                          fontSize: 'clamp(2.5rem, 5vw, 4.5rem)',
                          color: 'var(--color-primary)'}}
                      >
                        Protege vidas con SafeWork 4.0
                      </span>
                      <span
                        className="w-14 h-14 rounded-full flex items-center justify-center shrink-0 mx-4"
                        style={{ backgroundColor: 'var(--color-primary)', color: '#ffffff'}}
                      >
                        <ShieldCheck className="w-8 h-8" />
                      </span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="max-w-[1320px] mx-auto px-4 sm:px-8 pt-6 text-center">
                <p className="text-lg sm:text-xl font-bold" style={{ color: 'var(--color-dark)'}}>
                  Inspecciona en 1 minuto • Bloquea fallas al instante • Audita en 1 clic
                </p>
              </div>
            </section>

            {/* ---------------------------------------------------------------
                SECCIÓN 4: LAS 6 PÁGINAS DEL PRODUCTO EN TARJETAS PASTEL ALTGAGE

                  <span
                    className="px-3.5 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider"
                    style={{ backgroundColor: 'var(--color-primary-200)', color: '#118d70'}}
                  >
                    Arquitectura Multi-Página
                  </span>
                  <h2
                    className="altgage-serif mt-3"
                    style={{ fontSize: 'clamp(2rem, 4vw, 3.25rem)'}}
                  >
                    Explora las 6 Páginas Especializadas
                  </h2>
                  <p className="text-base mt-2" style={{ color: '#5c3178'}}>
                    Cada módulo vive en su propia página independiente con instrucciones paso a paso para que cualquier usuario lo domine al instante.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-7">
                  {['normativa', 'inspecciones', 'riesgos', 'monitoreo', 'capacitacion', 'loto'].map((key) => {
                    const page = PAGE_ROUTES[key];
                    return (
                      <div
                        key={key}
                        onClick={() => navigateToPage(key)}
                        className={`${page.pastelClass} p-7 sm:p-9 cursor-pointer transition-all hover:scale-[1.01] shadow-md flex flex-col justify-between border-2`}
                        style={{ borderColor: 'rgba(77, 29, 106, 0.12)'}}
                      >
                        <div>
                          <div className="flex items-center justify-between gap-3 mb-4">
                            <span
                              className="px-3.5 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider"
                              style={{ backgroundColor: '#ffffff', color: 'var(--color-dark)'}}
                            >
                              {page.shortTitle}
                            </span>
                            {key === 'loto'&& lockedMachinesCount > 0 && (
                              <span
                                className="px-3 py-1 rounded-full text-xs font-extrabold"
                                style={{ backgroundColor: '#e11d48', color: '#ffffff'}}
                              >
                                {lockedMachinesCount} Bloqueada(s)
                              </span>
                            )}
                          </div>

                          <h3 className="altgage-serif text-2xl sm:text-3xl mb-2">
                            {page.title}
                          </h3>
                          <p className="text-sm font-medium mb-5" style={{ color: '#40165a'}}>
                            {page.subtitle}
                          </p>

                          {/* Lista de 3 pasos simples */}
                          <div
                            className="rounded-2xl p-4 space-y-2 mb-6"
                            style={{ backgroundColor: 'rgba(255, 255, 255, 0.78)'}}
                          >
                            <div className="text-[11px] font-extrabold uppercase tracking-wider" style={{ color: '#118d70'}}>
                              Guía Rápida (3 Pasos Simples):
                            </div>
                            {page.pokaYokeSteps.map((step, i) => (
                              <div key={i} className="text-xs font-bold flex items-center gap-2">
                                <span
                                  className="w-2 h-2 rounded-full shrink-0"
                                  style={{ backgroundColor: 'var(--color-dark)'}}
                                />
                                <span>{step}</span>
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className="flex items-center justify-between pt-2">
                          <AltgageButton
                            theme="primary"
                            onClick={(e) => {
                              e.stopPropagation();
                              navigateToPage(key);
                            }}
                          >
                            <span>Abrir {page.shortTitle}</span>
                            <ArrowRight className="w-4 h-4" />
                          </AltgageButton>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* ---------------------------------------------------------------
                SECCIÓN 5: CALENDARIO INTERACTIVO DE 15 DÍAS ALTGAGE (.calendar-module)
                --------------------------------------------------------------- */}
            <section className="py-12 sm:py-16" style={{ backgroundColor: '#ffffff'}}>
              <div className="max-w-[1320px] mx-auto px-4 sm:px-8">
                <div
                  className="rounded-3xl p-7 sm:p-12 grid grid-cols-1 lg:grid-cols-12 gap-10 items-center"
                  style={{ backgroundColor: 'var(--color-primary-200)'}}
                >
                  <div className="lg:col-span-6 space-y-6">
                    <div>
                      <span
                        className="px-3.5 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider"
                        style={{ backgroundColor: '#ffffff', color: '#118d70'}}
                      >
                        Ciclo Preventivo de 15 Días
                      </span>
                      <h2
                        className="altgage-serif mt-3"
                        style={{ fontSize: 'clamp(2rem, 3.8vw, 3.1rem)'}}

                        Cumplimiento total en 15 días
                      </h2>
                      <p className="text-base mt-2 leading-relaxed" style={{ color: '#40165a'}}>

                      </p>
                    </div>

                    <div
                      className="rounded-3xl p-6 shadow-lg border-2"
                      style={{ backgroundColor: '#ffffff', borderColor: 'var(--color-dark)'}}
                    >
                      <div className="flex items-center justify-between gap-2 mb-2">
                        <span
                          className="px-3 py-1 rounded-full text-xs font-extrabold"
                          style={{ backgroundColor: 'var(--color-primary-400)', color: 'var(--color-dark)'}}
                        >
                          {activeMilestone.tag}
                        </span>
                        <span className="text-xs font-bold" style={{ color: '#702987'}}>
                          Hito #{activeMilestone.day} de 15
                        </span>
                      </div>
                      <h3 className="altgage-serif text-2xl mb-2">
                        {activeMilestone.title}
                      </h3>
                      <p className="text-sm leading-relaxed mb-5" style={{ color: '#40165a'}}>
                        {activeMilestone.desc}
                      </p>
                      <AltgageButton
                        theme="primary"
                        onClick={() => navigateToPage(activeMilestone.page)}
                      >
                        <span>Ejecutar este paso en Página {PAGE_ROUTES[activeMilestone.page].num}</span>
                        <ArrowRight className="w-4 h-4" />
                      </AltgageButton>
                    </div>
                  </div>

                  <div className="lg:col-span-6">
                    <div className="altgage-calendar-module">
                      <div className="px-6 py-4 flex items-center justify-between">
                        <h3 className="altgage-serif text-xl" style={{ color: '#ffffff'}}>
                          Cronograma Operativo de 15 Días
                        </h3>
                        <span className="text-xs font-bold" style={{ color: 'var(--color-primary-400)'}}>
                          Haz clic en un día
                        </span>
                      </div>
                      <div className="altgage-calendar-body">
                        <div className="altgage-calendar-grid">
                          {Array.from({ length: 15 }, (_, idx) => {
                            const dayNum = idx + 1;
                            const hasMilestone = Boolean(CALENDAR_MILESTONES[dayNum]);
                            const isSelected = activeCalendarDay === dayNum;
                            return (
                              <div
                                key={dayNum}
                                data-active={isSelected ? 'true': 'false'}
                                onClick={() => {
                                  if (hasMilestone) setActiveCalendarDay(dayNum);
                                }}
                                className="altgage-calendar-cell"
                                style={{
                                  opacity: hasMilestone ? 1 : 0.45,
                                  cursor: hasMilestone ? 'pointer': 'default'}}
                              >
                                <div className="altgage-calendar-circle">
                                  <span>{dayNum}</span>
                                </div>
                                {isSelected && (
                                  <div className="absolute inset-1 pointer-events-none flex items-center justify-center">
                                    <HandDrawnEllipse className="w-full h-full" />
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ---------------------------------------------------------------
                SECCIÓN 6: MEGA CTA BANNER ALTGAGE (.section-mega-title)
                --------------------------------------------------------------- */}
            <section
              onClick={() => navigateToPage('inspecciones')}
              className="mega-btn-link cursor-pointer text-center py-16 transition-all"
              style={{
                backgroundColor: 'var(--color-primary-400)',
                borderTopLeftRadius: '3rem',
                borderTopRightRadius: '3rem'}}
            >
              <div className="max-w-4xl mx-auto px-4">
                <div className="inline-block">
                  <h2
                    className="altgage-serif"
                    style={{ fontSize: 'clamp(2.5rem, 5vw, 4.25rem)', color: 'var(--color-dark)'}}
                  >
                    Comenzar Recorrido Guiado
                  </h2>
                  <div className="mega-btn-line mx-auto" />
                </div>
                <p className="text-lg font-bold mt-4" style={{ color: 'var(--color-dark)'}}>
                  Prueba el flujo completo de seguridad en menos de 2 minutos →
                </p>
              </div>
            </section>
          </div>
        ) : (
          /* =================================================================
             VISTA DE PÁGINA INDIVIDUAL (01 A 06)
             ================================================================= */
          <div className="max-w-[1440px] mx-auto px-4 sm:px-8 py-4 space-y-6">
            {/* Renderizado de la Página Activa con Props Exactos */}
            <div className="py-2">
              {currentPage === 'normativa'&& (
                <Module1Normativa
                  regulatoryAlerts={regulatoryAlerts}
                  setRegulatoryAlerts={setRegulatoryAlerts}
                  audits={audits}
                  setAudits={setAudits}
                  addNotification={addNotification}
                />
              )}

              {currentPage === 'inspecciones'&& (
                <Module2Checklists
                  machines={machines}
                  setMachines={setMachines}
                  checklistLogs={checklistLogs}
                  setChecklistLogs={setChecklistLogs}
                  workers={workers}
                  setWorkers={setWorkers}
                  activeWorkerId={activeWorkerId}
                  setActiveWorkerId={setActiveWorkerId}
                  addNotification={addNotification}
                  setActiveTab={navigateToPage}
                  triggerIoTAlertFromChecklist={() => setIotForceAlert(true)}
                />
              )}

              {currentPage === 'riesgos'&& (
                <Module3Riesgos
                  riskReports={riskReports}
                  setRiskReports={setRiskReports}
                  machines={machines}
                  setMachines={setMachines}
                  addNotification={addNotification}
                  setActiveTab={navigateToPage}
                />
              )}

              {currentPage === 'monitoreo'&& (
                <Module4IoT
                  machines={machines}
                  riskReports={riskReports}
                  iotForceAlert={iotForceAlert}
                  setIotForceAlert={setIotForceAlert}
                  addNotification={addNotification}
                  setActiveTab={navigateToPage}
                />
              )}

              {currentPage === 'capacitacion'&& (
                <Module5Capacitacion
                  courses={activeWorkerCourses}
                  setCourses={handleUpdateActiveWorkerCourses}
                  workers={workers}
                  setWorkers={setWorkers}
                  activeWorkerId={activeWorkerId}
                  setActiveWorkerId={setActiveWorkerId}
                  userCoursesMap={userCoursesMap}
                  setUserCoursesMap={setUserCoursesMap}
                  certificates={certificates}
                  setCertificates={setCertificates}
                  addNotification={addNotification}
                />
              )}

              {currentPage === 'loto'&& (
                <Module6Loto
                  machines={machines}
                  setMachines={setMachines}
                  lotoHistory={lotoHistory}
                  setLotoHistory={setLotoHistory}
                  setIotForceAlert={setIotForceAlert}
                  addNotification={addNotification}
                  setActiveTab={navigateToPage}
                />
              )}
            </div>

            {/* Paginación Inferior entre páginas */}
            <div
              className="rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4 border-2"
              style={{ backgroundColor: '#ffffff', borderColor: '#a4f0d0'}}
            >
              <div>
                {prevPageKey ? (
                  <AltgageButton theme="light" onClick={() => navigateToPage(prevPageKey)}>
                    <span>← Anterior: {PAGE_ROUTES[prevPageKey].title}</span>
                  </AltgageButton>
                ) : (
                  <span />
                )}
              </div>
              <div className="text-xs font-bold" style={{ color: '#5c3178'}}>
                Página {activeRouteInfo.num} de 06 • Datos sincronizados automáticamente
              </div>
              <div>
                {nextPageKey ? (
                  <AltgageButton theme="primary" onClick={() => navigateToPage(nextPageKey)}>
                    <span>Siguiente: {PAGE_ROUTES[nextPageKey].title} →</span>
                  </AltgageButton>
                ) : (
                  <AltgageButton theme="mint" onClick={() => navigateToPage('home')}>
                    <span>Volver a Portada Principal →</span>
                  </AltgageButton>
                )}
              </div>
            </div>
          </div>
        )}
      </main>

      {/* =====================================================================
          FOOTER ESTILO ALTGAGE (FONDO PURPLE PROFUNDO #4D1D6A + TARJETAS INFERIORES)
          ===================================================================== */}
      <footer
        className="pt-14 pb-10 px-4 sm:px-8 mt-12"
        style={{ backgroundColor: 'var(--color-dark)', color: '#ffffff'}}
      >
        <div className="max-w-[1320px] mx-auto space-y-10">
          {/* 4 Tarjetas de Acceso Rápido estilo Footer de Altgage */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {[
              { title: 'Normativa 522-06', sub: 'Leyes y Vencimientos', key: 'normativa'},
              { title: 'Inspección Equipos', sub: 'Checklists Pre-Uso', key: 'inspecciones'},
              { title: 'Triaje de Riesgos', sub: 'Matriz Fine 3×3', key: 'riesgos'},
              { title: 'Protocolo LOTO', sub: 'Liberación Doble Firma', key: 'loto'}
            ].map((card) => (
              <div
                key={card.key}
                onClick={() => navigateToPage(card.key)}
                className="rounded-3xl p-5 cursor-pointer transition-transform hover:scale-[1.02]"
                style={{ backgroundColor: 'var(--color-secondary-700)', border: '1px solid #702987'}}
              >
                <div className="flex items-center justify-between mb-2">
                  <span className="altgage-serif text-lg" style={{ color: 'var(--color-primary-400)'}}>
                    {card.title}
                  </span>
                  <ArrowUpRight className="w-4 h-4" style={{ color: 'var(--color-primary-400)'}} />
                </div>
                <p className="text-xs opacity-80">{card.sub}</p>
              </div>
            ))}
          </div>

          <div className="pt-6 border-t flex flex-wrap items-center justify-between gap-4 text-xs" style={{ borderColor: '#702987'}}>
            <div>
              <strong style={{ color: 'var(--color-primary-400)'}}>SafeWork 4.0 — TECTROMAQ Santo Domingo</strong> •
              Plataforma de Seguridad y Salud Ocupacional (Decreto 522-06 / ISO 45001)
            </div>
            <button
              onClick={handleResetDemo}
              className="underline font-bold flex items-center gap-1"
              style={{ color: 'var(--color-primary-400)'}}
            >
              <RotateCcw className="w-3.5 h-3.5" /> Restaurar Datos de Demostración
            </button>
          </div>
        </div>
      </footer>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

  </script>
