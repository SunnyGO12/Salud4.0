  const handleRenewAlert = (alertId) => {
    const nextYear = new Date();

    setRegulatoryAlerts((prev) =>
      prev.map((item) => {
        if (item.id === alertId) {
          return {
            ...item,
            estado: 'Vigente',

        return item;

    const headers = ['ID Auditoria', 'Fecha', 'Tipo de Auditoria', 'Inspector', 'Sede', 'Cumplimiento', 'Estado', 'Hallazgos'];
    const rows = audits.map((a) => [

      `"${a.inspector}"`,
      `"${a.sede}"`,
      a.cumplimiento,
      `"${a.estado}"`,
      `"${a.hallazgos}"`
    ]);
    const csvContent =
      '\uFEFF'+
      [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Reporte_Auditorias_SST_TECIROMAQ_${new Date().toISOString().slice(0, 10)}.csv`;

  const selectedMachine = machines.find((m) => m.id === selectedMachineId) || machines[0];

  const [operador, setOperador] = useState(selectedMachine?.operadorAsignado || 'Op. Carlos M. Castillo');
  const [horometro, setHorometro] = useState(String(selectedMachine?.horometro || 0));
  const [geoPreset, setGeoPreset] = useState('SD');
  const [coordenadas, setCoordenadas] = useState('18.4861° N, 69.9312° W — Patio Central TECIROMAQ Santo Domingo');
  const [photoPreview, setPhotoPreview] = useState('hydraulic_leak'); // 'hydraulic_leak'| 'brake_wear'| 'compliant_machine'| custom dataURL
  const [observacionesGenerales, setObservacionesGenerales] = useState('');

  // Estado de cada sub-requisito normativo (checkboxes obligatorios para poder declarar CONFORME)
  const [subChecks, setSubChecks] = useState({
    'CHK-01-A': true,
    'CHK-01-B': true,
    'CHK-01-C': true,
    'CHK-02-A': true,
    'CHK-02-B': true,
    'CHK-02-C': true,
    'CHK-03-A': true,
    'CHK-03-B': true,
    'CHK-03-C': true,
    'CHK-04-A': true,
    'CHK-04-B': true,
    'CHK-04-C': true,
    'CHK-05-A': true,
    'CHK-05-B': true,
    'CHK-05-C': true
  });

  // Estado de cada punto del checklist: 'CONFORME' | 'NO_CONFORME'
  const [answers, setAnswers] = useState({
    'CHK-01': 'CONFORME',
    'CHK-02': 'CONFORME',
    'CHK-03': 'CONFORME',
    'CHK-04': 'CONFORME',
    'CHK-05': 'CONFORME'
  });

  // Controla qué punto tiene desplegado el checklist de inspección normativa
  const [openItemId, setOpenItemId] = useState(null);

  const toggleInspectPanel = (itemId) => {
    setOpenItemId((prev) => (prev === itemId ? null : itemId));
  };

  const handleToggleSubCheck = (item, reqId) => {
    setSubChecks((prev) => {
      const next = { ...prev, [reqId]: !prev[reqId] };
      const allMet = (item.requisitos || []).every((r) => next[r.id]);
      setAnswers((prevAns) => ({
        ...prevAns,
        [item.id]: allMet ? 'CONFORME' : 'NO_CONFORME'
      }));
      return next;
    });
  };

  const handleMarkItemConforme = (item) => {
    const updatedSubs = {};
    (item.requisitos || []).forEach((r) => {
      updatedSubs[r.id] = true;
    });
    setSubChecks((prev) => ({ ...prev, ...updatedSubs }));
    setAnswers((prev) => ({ ...prev, [item.id]: 'CONFORME' }));
  };

  const handleMarkItemNoConforme = (item) => {
    const firstReq = item.requisitos?.[0];
    if (firstReq) {
      const allMet = (item.requisitos || []).every((r) => subChecks[r.id]);
      if (allMet) {
        setSubChecks((prev) => ({ ...prev, [firstReq.id]: false }));
      }
    }
    setAnswers((prev) => ({ ...prev, [item.id]: 'NO_CONFORME' }));
  };

  // Canvas de firma digital
  const canvasRef = useRef(null);
  const [isDrawing, setIsDrawing] = useState(false);
  const [hasSignature, setHasSignature] = useState(false);

  // Modal de resultado de bloqueo LOTO
  const [lockoutModalData, setLockoutModalData] = useState(null);

  useEffect(() => {
    if (selectedMachine) {
      setOperador(selectedMachine.operadorAsignado);
      setHorometro(String(selectedMachine.horometro));
    }
  }, [selectedMachineId]);

  // Inicializar canvas con guía sutil
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
  }, []);

  const handleGeoChange = (preset) => {
    setGeoPreset(preset);
    if (preset === 'SD') {
      setCoordenadas('18.4861° N, 69.9312° W — Patio Central TECIROMAQ Santo Domingo');
    } else if (preset === 'PC') {
      setCoordenadas('18.5601° N, 68.3725° W — Frente de Obra Bávaro / Punta Cana');
    } else {
      setCoordenadas('18.4729° N, 69.8923° W — Zona Industrial de Herrera, Santo Domingo Oeste');
    }
  };

  const handlePhotoUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      setPhotoPreview(ev.target.result);
    };
    reader.readAsDataURL(file);
  };

  // Funciones de firma en Canvas (Mouse y Touch)
  const getCoordinates = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    if (e.touches && e.touches[0]) {
      return {
        x: (e.touches[0].clientX - rect.left) * scaleX,
        y: (e.touches[0].clientY - rect.top) * scaleY
      };
    }
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  };

  const startDrawing = (e) => {
    e.preventDefault();
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const pos = getCoordinates(e, canvas);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    setIsDrawing(true);
    setHasSignature(true);
  };

  const draw = (e) => {
    if (!isDrawing) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    const pos = getCoordinates(e, canvas);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  };

  const stopDrawing = () => {
    setIsDrawing(false);
  };

  const clearSignature = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setHasSignature(false);
  };

  const applyQuickDigitalSignature = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(35, 75);
    ctx.bezierCurveTo(65, 25, 95, 95, 135, 45);
    ctx.bezierCurveTo(165, 20, 190, 85, 235, 55);
    ctx.lineTo(310, 50);
    ctx.stroke();

    ctx.fillStyle = '#0369a1';
    ctx.font = '11px Plus Jakarta Sans, sans-serif';
    ctx.fillText(`FIRMA VALIDADA: ${operador.toUpperCase()}`, 35, 98);
    setHasSignature(true);
  };

  // Verificar si algún punto crítico está marcado como NO_CONFORME
  const criticalFailures = CHECKLIST_TEMPLATE.filter(
    (item) => item.critico && answers[item.id] === 'NO_CONFORME');
  const hasCriticalFailure = criticalFailures.length > 0;

  const handleSimulateCriticalFailureDemo = () => {
    setSubChecks({
      'CHK-01-A': true,
      'CHK-01-B': true,
      'CHK-01-C': true,
      'CHK-02-A': false,
      'CHK-02-B': false,
      'CHK-02-C': true,
      'CHK-03-A': true,
      'CHK-03-B': true,
      'CHK-03-C': true,
      'CHK-04-A': true,
      'CHK-04-B': true,
      'CHK-04-C': true,
      'CHK-05-A': true,
      'CHK-05-B': true,
      'CHK-05-C': true
    });
    setAnswers({
      'CHK-01': 'CONFORME',
      'CHK-02': 'NO_CONFORME',
      'CHK-03': 'CONFORME',
      'CHK-04': 'CONFORME',
      'CHK-05': 'CONFORME'});
    setOpenItemId('CHK-02');
    setPhotoPreview('hydraulic_leak');
    setObservacionesGenerales(
      'Fuga activa detectada en racor de manguera hidráulica de alta presión del brazo principal (34,000 kPa). Peligro de rotura e inyección de fluido.');
    applyQuickDigitalSignature();
  };

  const handleSubmitChecklist = (e) => {
    e.preventDefault();
    if (!hasSignature) {
      applyQuickDigitalSignature();
    }

    const timestamp = new Date().toLocaleString('es-DO', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'});

    if (hasCriticalFailure) {
      const generatedLotoCode = `LOTO-2026-SD-${Math.floor(1000 + Math.random() * 8999)}`;
      const generatedWorkOrder = `OT-MANT-2026-${Math.floor(1000 + Math.random() * 8999)}`;
      const failureSummary = criticalFailures.map((f) => f.titulo).join('+ ');

      // Bloquear máquina automáticamente
      setMachines((prev) =>
        prev.map((m) => {
          if (m.id === selectedMachineId) {
            return {
              ...m,
              operadorAsignado: operador,
              horometro: parseFloat(horometro) || m.horometro,
              ubicacion: coordenadas,
              estado: 'BLOQUEADO_LOTO',
              lotoCode: generatedLotoCode,
              workOrder: generatedWorkOrder,
              motivoBloqueo: `${failureSummary}. ${observacionesGenerales || ''}`.trim(),
              fechaBloqueo: timestamp,
              ultimaInspeccion: timestamp,
              presionHidraulica: '19,200 kPa (Caída Crítica)',
              saludBomba: 48
            };
          }
          return m;
        })
      );

      // Registrar en bitácora de checklists
      const newLog = {
        id: `INSP-${Math.floor(10000 + Math.random() * 89999)}`,
        fecha: timestamp,
        maquinaId: selectedMachine.id,
        maquinaNombre: selectedMachine.nombre,
        machineId: selectedMachine.id,
        machineName: selectedMachine.nombre,
        operador,
        horometro,
        coordenadas,
        resultado: 'BLOQUEO CRÍTICO LOTO',
        lotoCode: generatedLotoCode,
        workOrder: generatedWorkOrder,
        fallasCriticas: criticalFailures.map((c) => c.titulo),
        fallasDetectadas: criticalFailures.map((c) => c.titulo),
        firma: `FIRMA_DIGITAL_${operador.toUpperCase()}`
      };
      setChecklistLogs((prev) => [newLog, ...prev]);

      // Disparar anomalía en telemetría IoT (Módulo 4)
      if (triggerIoTAlertFromChecklist) {
        triggerIoTAlertFromChecklist(selectedMachine.nombre, generatedLotoCode);
      }

      addNotification(
        ` PARADA CRÍTICA LOTO: ${selectedMachine.id}`,
        `Equipo bloqueado automáticamente (${generatedLotoCode}). Orden emitida: ${generatedWorkOrder}.`,
        'critical',
        'loto');

      setLockoutModalData({
        machine: selectedMachine.nombre,
        machineId: selectedMachine.id,
        lotoCode: generatedLotoCode,
        workOrder: generatedWorkOrder,
        operador,
        coordenadas,
        failures: criticalFailures
      });
    } else {
      // Todo conforme -> equipo operativo
      setMachines((prev) =>
        prev.map((m) => {
          if (m.id === selectedMachineId) {
            return {
              ...m,
              operadorAsignado: operador,
              horometro: parseFloat(horometro) || m.horometro,
              ubicacion: coordenadas,
              ultimaInspeccion: timestamp
            };
          }
          return m;
        })
      );

      const newLog = {
        id: `INSP-${Math.floor(10000 + Math.random() * 89999)}`,
        fecha: timestamp,
        maquinaId: selectedMachine.id,
        maquinaNombre: selectedMachine.nombre,
        machineId: selectedMachine.id,
        machineName: selectedMachine.nombre,
        operador,
        horometro,
        coordenadas,
        resultado: 'APROBADO / OPERATIVO',
        lotoCode: null,
        workOrder: null,
        fallasCriticas: [],
        fallasDetectadas: [],
        firma: `FIRMA_DIGITAL_${operador.toUpperCase()}`
      };
      setChecklistLogs((prev) => [newLog, ...prev]);

      addNotification(
        ` Inspección Conforme: ${selectedMachine.id}`,
        `Checklist pre-operacional aprobado para ${selectedMachine.nombre}. Unidad autorizada para turno.`,
        'success',
        'checklists');
    }
  };

  return (
    <div className="space-y-6">
      {/* Header Banner */}
      <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-zinc-900 via-slate-900 to-zinc-900 border border-slate-800 p-6 sm:p-7 shadow-xl">
        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-5">
          <div>
            <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold mb-2">
              <ClipboardCheck className="w-3.5 h-3.5" />
              INSPECCIÓN PRE-OPERACIONAL & REGLA STOP-WORK (MAQUINARIA PESADA)
            </div>
            <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
              Checklists Dinámicos con Vinculación Normativa & Bloqueo LOTO
            </h1>
            <p className="text-slate-400 text-sm mt-1.5 max-w-3xl leading-relaxed">
              Verificación técnica pre-turno obligatoria. Cualquier hallazgo <span className="text-rose-400 font-bold">Crítico No Conforme</span> ejecuta automáticamente el protocolo de bloqueo de energía <strong className="text-amber-400">LOTO</strong> y emite la Orden de Mantenimiento.
            </p>
          </div>
          <div className="flex flex-wrap items-center gap-3 shrink-0">
            {selectedMachine?.estado === 'BLOQUEADO_LOTO' && (
              <button
                type="button"
                onClick={() => {
                  setMachines((prev) =>
                    prev.map((m) =>
                      m.id === selectedMachineId
                        ? {
                            ...m,
                            estado: 'OPERATIVO',
                            lotoCode: null,
                            workOrder: null,
                            motivoBloqueo: null,
                            fechaBloqueo: null
                          }
                        : m
                    )
                  );
                  addNotification(
                    ` Desbloqueo Técnico: ${selectedMachine.id}`,
                    `Unidad restaurada a OPERATIVO para permitir nuevas inspecciones pre-operacionales.`,
                    'success',
                    'checklists'
                  );
                }}
                className="inline-flex items-center gap-2 px-4 py-3 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-all shadow-lg"
              >
                <Unlock className="w-3.5 h-3.5" />
                Habilitar {selectedMachine.id} a Operativo
              </button>
            )}
            <button
              type="button"
              onClick={handleSimulateCriticalFailureDemo}
              className="inline-flex items-center gap-2 px-5 py-3 rounded-full bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition-all shadow-lg"
            >
              <AlertOctagon className="w-3.5 h-3.5" />
              Simular Falla Crítica LOTO (Demo 1-Clic)
            </button>
          </div>
        </div>
      </div>

      {/* Paso 1: Selector de Maquinaria Pesada (3 Unidades) */}
      <div className="space-y-3">
        <div className="flex flex-wrap items-center justify-between gap-2 px-1">
          <h2 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
            <Truck className="w-4 h-4 text-amber-400" />
            1. Seleccione Activo de Maquinaria Pesada a Inspeccionar
          </h2>
          <span className="text-xs font-medium text-slate-400">
            Flota Pesada TECIROMAQ Santo Domingo / Punta Cana
          </span>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
          {machines.map((machine) => {
            const isSelected = machine.id === selectedMachineId;
            const isLocked = machine.estado === 'BLOQUEADO_LOTO';
            return (
              <button
                key={machine.id}
                type="button"
                onClick={() => setSelectedMachineId(machine.id)}
                className={`text-left p-6 rounded-3xl border-2 transition-all relative overflow-hidden ${
                  isSelected
                    ? isLocked
                      ? 'bg-rose-950/25 border-rose-500 shadow-xl'
                      : 'bg-zinc-900 border-emerald-500 shadow-xl'
                    : 'bg-zinc-900/60 border-slate-800 hover:border-slate-700'
                }`}
              >
                <div className="flex items-center justify-between gap-3 mb-3">
                  <span className="px-3 py-1 rounded-lg bg-slate-950 border border-slate-800 font-mono text-xs font-bold text-amber-400">
                    {machine.id}
                  </span>
                  {isLocked ? (
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-extrabold bg-rose-600 text-white">
                      <Lock className="w-3 h-3" />
                      BLOQUEADO LOTO
                    </span>
                  ) : (
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                      <CheckCircle2 className="w-3 h-3" />
                      OPERATIVO
                    </span>
                  )}
                </div>

                <h3 className="text-base font-extrabold text-white leading-snug">
                  {machine.nombre}
                </h3>
                <p className="text-xs text-slate-400 font-mono mt-1.5">
                  Serie: {machine.serie} • Horómetro: {machine.horometro} hrs
                </p>

                <div className="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
                  <span className="text-slate-300 truncate font-medium">{machine.operadorAsignado}</span>
                  {machine.lotoCode && (
                    <span className="font-mono font-bold text-rose-400">
                      {machine.lotoCode}
                    </span>
                  )}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* Formulario Principal de Inspección */}
      <form onSubmit={handleSubmitChecklist} className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        {/* Columna Izquierda: Datos de Campo + Puntos de Verificación */}
        <div className="lg:col-span-7 space-y-6">
          {/* Paso 2: Datos de campo obligatorios */}
          <div className="bg-zinc-900/90 border border-slate-800 rounded-3xl p-7 sm:p-8 shadow-lg space-y-5">
            <div className="pb-3 border-b border-slate-800 space-y-1.5">
              <div className="flex items-center justify-between gap-3">
                <h3 className="text-lg font-bold text-white flex items-center gap-2.5 leading-none">
                  <UserCheck className="w-5 h-5 text-amber-400 shrink-0" />
                  <span>2. Datos Obligatorios de Campo y Geolocalización</span>
                </h3>
              </div>
              <p className="text-xs text-slate-400">
                Verifique el operador responsable, la lectura del horómetro y la ubicación GPS del equipo.
              </p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="block text-xs font-bold text-slate-300">
                    Operador Asignado (Carné MOPC Cat. 05)
                  </label>
                  {workers.length > 0 && (
                    <span className="text-[11px] text-amber-400 font-mono">
                      {workers.length} operadores registrados
                    </span>
                  )}
                </div>
                <div className="relative">
                  <input
                    type="text"
                    required
                    list="registered-workers-list"
                    value={operador}
                    onChange={(e) => setOperador(e.target.value)}
                    placeholder="Seleccione o escriba el nombre del operador"
                    className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-amber-500 focus:outline-none"
                  />
                  <datalist id="registered-workers-list">
                    {workers.map((w) => (
                      <option key={w.id} value={w.nombre}>
                        {w.cargo} ({w.id} • {w.cedula})
                      </option>
                    ))}
                  </datalist>
                </div>
                {workers.length > 0 && (
                  <div className="flex flex-wrap gap-1.5 mt-2">
                    {workers.map((w) => (
                      <button
                        key={w.id}
                        type="button"
                        onClick={() => setOperador(w.nombre)}
                        className={`text-[11px] px-2.5 py-1 rounded-lg border transition-all ${
                          operador === w.nombre
                            ? 'bg-amber-500 text-slate-950 font-bold border-amber-500'
                            : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'
                        }`}
                      >
                        {w.id}: {w.nombre.split(' ')[1] || w.nombre}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-300 mb-2">
                  Horómetro Actual de Cabina (Horas)
                </label>
                <div className="relative">
                  <Gauge className="w-4 h-4 text-amber-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                  <input
                    type="number"
                    step="0.1"
                    required
                    value={horometro}
                    onChange={(e) => setHorometro(e.target.value)}
                    className="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-sm font-mono text-white focus:border-amber-500 focus:outline-none"
                  />
                </div>
              </div>
            </div>

            <div className="space-y-2.5">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <label className="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                  <MapPin className="w-3.5 h-3.5 text-amber-400 shrink-0" />
                  <span>Geolocalización Satelital GPS (República Dominicana)</span>
                </label>
                <div className="flex flex-wrap items-center gap-2">
                  {[
                    { code: 'SD', label: 'Santo Domingo' },
                    { code: 'PC', label: 'Punta Cana' },
                    { code: 'HERRERA', label: 'Taller Herrera' }
                  ].map((loc) => (
                    <button
                      key={loc.code}
                      type="button"
                      onClick={() => handleGeoChange(loc.code)}
                      className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition-all ${
                        geoPreset === loc.code
                          ? 'bg-emerald-600 text-white shadow-sm'
                          : 'bg-slate-950 text-slate-400 border border-slate-800'
                      }`}
                    >
                      {loc.label}
                    </button>
                  ))}
                </div>
              </div>
              <input
                type="text"
                readOnly
                value={coordenadas}
                className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs font-mono text-emerald-400"
              />
            </div>
          </div>

          {/* Paso 3: Puntos de Verificación con Checklist de Cumplimiento Normativo */}
          <div className="bg-zinc-900/90 border border-slate-800 rounded-3xl p-7 sm:p-8 shadow-lg space-y-5">
            <div className="pb-4 border-b border-slate-800 space-y-1.5">
              <div className="flex items-center justify-between gap-4">
                <h3 className="text-lg font-bold text-white flex items-center gap-2.5 leading-none">
                  <ShieldAlert className="w-5 h-5 text-amber-400 shrink-0" />
                  <span>3. Puntos de Verificación y Criterios de Normativa Vinculada</span>
                </h3>
                <button
                  type="button"
                  onClick={() => {
                    const allTrue = {};
                    CHECKLIST_TEMPLATE.forEach((it) => {
                      (it.requisitos || []).forEach((r) => {
                        allTrue[r.id] = true;
                      });
                    });
                    setSubChecks(allTrue);
                    setAnswers({
                      'CHK-01': 'CONFORME',
                      'CHK-02': 'CONFORME',
                      'CHK-03': 'CONFORME',

        prev.map((s) => {
          if (s.id === 'SNS-VIB') {
            return {
              ...s,
              valor: 7.9,
              forzarAlerta: true,
              historial: [...s.historial.slice(1), 7.9]
            };
          }
          if (s.id === 'SNS-NOISE') {
            return {
              ...s,
              valor: 89.6,

            };
          }
          return s;
        })
      );
    }
  }, [iotForceAlert]);

  // Ciclo de actualización automática cada 4 segundos
  useEffect(() => {
    const interval = setInterval(() => {
      setSensors((prev) =>
        prev.map((s) => {
          let nextVal = s.valor;
          if (s.forzarAlerta) {
            const delta = (Math.random() - 0.45) * 1.2;
            nextVal = Math.max(s.limite + 0.6, Number((s.valor + delta).toFixed(1)));
          } else {
            const delta = (Math.random() - 0.48) * 1.2;
            const raw = Number((s.valor + delta).toFixed(1));
            if (s.id === 'SNS-NOISE') {
              nextVal = Math.min(84.2, Math.max(76.0, raw));
            } else if (s.id === 'SNS-TEMP') {
              nextVal = Math.min(31.4, Math.max(28.5, raw));
            } else if (s.id === 'SNS-GAS') {
              nextVal = Math.min(21.0, Math.max(9.0, raw));
            } else {
              nextVal = Math.min(4.1, Math.max(2.4, raw));
            }
          }
          return {
            ...s,
            valor: nextVal,
            historial: [...s.historial.slice(1), nextVal]
          };

      );
      setLastTick(new Date().toLocaleTimeString('es-DO'));
    }, 4000);

    return () => clearInterval(interval);

          ? Number((s.limite * 1.18).toFixed(1))
          : Number((s.limite * 0.82).toFixed(1));
        return {
          ...s,
          forzarAlerta: nextForce,
          valor: nextVal,
          historial: [...s.historial.slice(1), nextVal]
        };
      })
    );
  };

  const plantAreas = [
    {
      nombre: 'Área de Taller Central',

    if (!activeCourse) return;

    const ratio = maxScroll <= 10 ? 1 : el.scrollTop / maxScroll;

    const prevLeidos = Array.isArray(activeCourse.modulosLeidos)
      ? [...activeCourse.modulosLeidos]
      : [false, false, false];

      nextLeidos[0] !== prevLeidos[0] ||
      nextLeidos[1] !== prevLeidos[1] ||
      nextLeidos[2] !== prevLeidos[2];

      const qScore = activeCourse.respuestaCorrectaRespondida ? 25 : 0;

function Module6Loto({
  machines,
  setMachines,
  lotoHistory,
  setLotoHistory,
  setIotForceAlert,
  addNotification,
  setActiveTab
}) {
  const lockedMachines = machines.filter((m) => m.estado === 'BLOQUEADO_LOTO');
  const [selectedLockedId, setSelectedLockedId] = useState(
    lockedMachines[0]?.id || ''
  );

  // Sincronizar selección cuando cambie la lista de bloqueadas
  useEffect(() => {
    if (lockedMachines.length > 0 && !lockedMachines.some((m) => m.id === selectedLockedId)) {
      setSelectedLockedId(lockedMachines[0].id);
    } else if (lockedMachines.length === 0) {
      setSelectedLockedId('');
    }
  }, [machines]);

  const currentLockedMachine = lockedMachines.find((m) => m.id === selectedLockedId);

  // Estado del modal de liberación
  const [isReleaseModalOpen, setIsReleaseModalOpen] = useState(false);

  // Doble Aprobación (Mantenimiento Técnico + Supervisor HSE)
  const [firmaMantenimiento, setFirmaMantenimiento] = useState(
    'Ing. Marcos Tejada (Jefe Mantenimiento Mecánico)'
  );
  const [aprobadoMantenimiento, setAprobadoMantenimiento] = useState(false);

  const [firmaHSE, setFirmaHSE] = useState(
    'Ing. Laura Báez (Supervisor Senior HSE)'
  );
  const [aprobadoHSE, setAprobadoHSE] = useState(false);

  // 3 Verificaciones obligatorias
  const [checks, setChecks] = useState({
    piezaReemplazada: false,
    retiroCandado: false,
    pruebaFrenos: false
  });

  const [notasTecnicasLiberacion, setNotasTecnicasLiberacion] = useState(
    'Se reemplazó manguera hidráulica SAE 100R12 de 34 MPa, se purgó circuito de frenos y se verificó presión nominal sin fugas.'
  );

  const allChecksComplete =
    checks.piezaReemplazada &&
    checks.retiroCandado &&
    checks.pruebaFrenos &&
    aprobadoMantenimiento &&
    aprobadoHSE;

  const handleAutoFillReleaseDemo = () => {
    setChecks({
      piezaReemplazada: true,
      retiroCandado: true,
      pruebaFrenos: true
    });
    setAprobadoMantenimiento(true);
    setAprobadoHSE(true);
  };

  const handleConfirmRelease = (e) => {
    if (e) e.preventDefault();
    if (!currentLockedMachine || !allChecksComplete) return;

    const releaseTimestamp = new Date().toLocaleString('es-DO', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });

    const newHistoryEntry = {
      id: `REL-2026-${Math.floor(100 + Math.random() * 899)}`,
      maquinaId: currentLockedMachine.id,
      maquinaNombre: currentLockedMachine.nombre,
      lotoCode: currentLockedMachine.lotoCode,
      workOrder: currentLockedMachine.workOrder,
      motivoOriginal: currentLockedMachine.motivoBloqueo,
      fechaBloqueo: currentLockedMachine.fechaBloqueo,
      fechaLiberacion: releaseTimestamp,
      aprobadoMantenimiento: firmaMantenimiento,
      aprobadoHSE: firmaHSE,
      verificaciones: [
        'Pieza reemplazada y fuga subsanada',
        'Retiro físico de candado y tarjeta LOTO',
        'Prueba funcional de frenos al 100%'
      ]
    };

    // Actualizar máquina a estado OPERATIVO
    setMachines((prev) =>
      prev.map((m) => {
        if (m.id === currentLockedMachine.id) {
          return {
            ...m,
            estado: 'OPERATIVO',
            lotoCode: null,
            workOrder: null,
            motivoBloqueo: null,
            fechaBloqueo: null,
            presionHidraulica: '34,500 kPa (Nominal)',
            saludBomba: 95
          };
        }
        return m;
      })
    );

    setLotoHistory((prev) => [newHistoryEntry, ...prev]);
    setIotForceAlert(false);

    // Resetear y cerrar modal
    setChecks({
      piezaReemplazada: false,
      retiroCandado: false,
      pruebaFrenos: false
    });
    setAprobadoMantenimiento(false);
    setAprobadoHSE(false);
    setIsReleaseModalOpen(false);

    addNotification(
      `Activo Liberado: ${currentLockedMachine.id}`,
      `Protocolo LOTO cerrado con doble firma. ${currentLockedMachine.nombre} regresa a estado OPERATIVO.`,
      'success',
      'loto'
    );
  };

  return (
    <div className="space-y-6">
      {/* Encabezado Principal */}
      <div className="rounded-2xl bg-zinc-900 border border-slate-800 p-6 shadow-xl">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 shrink-0">
              <Lock className="w-6 h-6" />
            </div>
            <h1 className="text-xl sm:text-2xl font-extrabold text-white tracking-tight">
              Liberación y Desbloqueo Técnico LOTO
            </h1>
          </div>

          <div className="flex items-center gap-2">
            {lockedMachines.length > 0 && currentLockedMachine ? (
              <button
                type="button"
                onClick={() => setIsReleaseModalOpen(true)}
                className="px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold transition-all shrink-0 inline-flex items-center gap-2 shadow-lg"
              >
                <Unlock className="w-4 h-4" />
                Liberar {currentLockedMachine.nombre}
              </button>
            ) : (
              <button
                type="button"
                onClick={() => setActiveTab('inspecciones')}
                className="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold transition-all shrink-0 inline-flex items-center gap-1.5"
              >
                Ir a Inspecciones
                <ArrowRight className="w-4 h-4" />
              </button>
            )}
          </div>
        </div>
        <p className="text-slate-400 text-sm mt-2">
          Cuando una máquina se bloquea por falla crítica en el checklist (frenos o fugas hidráulicas), no puede operar hasta que el mecánico y el supervisor HSE completen las 3 revisiones físicas y firmen la liberación.
        </p>
      </div>

      {/* 3 Tarjetas de Resumen Rápido */}
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
        <div className="bg-zinc-900/90 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
          <div>
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">
              Máquinas Bloqueadas
            </span>
            <span className={`text-3xl font-extrabold font-mono mt-1 block ${lockedMachines.length > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
              {lockedMachines.length} {lockedMachines.length === 1 ? 'Unidad' : 'Unidades'}
            </span>
            <span className="text-xs text-slate-400 mt-1 block">
              {lockedMachines.length > 0 ? 'Con candado LOTO activo' : 'Flota 100% disponible'}
            </span>
          </div>
          <div className={`p-3 rounded-xl border ${lockedMachines.length > 0 ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400'}`}>
            <Lock className="w-6 h-6" />
          </div>
        </div>

        <div className="bg-zinc-900/90 border border-slate-800 rounded-2xl p-5 flex items-center justify-between">
          <div>
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400 block">
              Máquinas Operativas
            </span>
            <span className="text-3xl font-extrabold font-mono text-emerald-400 mt-1 block">
              {machines.length - lockedMachines.length} / {machines.length}
            </span>
            <span className="text-xs text-slate-400 mt-1 block">
              Listas para trabajo en obra
            </span>

            <h3 className="text-base font-extrabold text-white">

            <p className="text-xs text-slate-300 max-w-md mx-auto">
              Toda la flota pesada está en estado operativo. Si desea probar el bloqueo en vivo, vaya al módulo de Inspecciones y marque un punto crítico como No Conforme.
            </p>
            <button
              type="button"
              onClick={() => setActiveTab('inspecciones')}
              className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold transition-all"
            >

              <ArrowRight className="w-3.5 h-3.5" />
            </button>
          </div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {lockedMachines.map((machine) => {
              const isSelected = machine.id === selectedLockedId;
              return (
                <div
                  key={machine.id}
                  onClick={() => setSelectedLockedId(machine.id)}
                  className={`p-5 rounded-2xl border cursor-pointer transition-all flex flex-col justify-between gap-4 ${
                    isSelected
                      ? 'bg-rose-950/30 border-rose-500 ring-2 ring-rose-500/30'
                      : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                  }`}
                >
                  <div>
                    <div className="flex items-center justify-between gap-2">
                      <span className="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-mono text-xs font-extrabold">
                        {machine.lotoCode}
                      </span>
                      <span className="px-2.5 py-1 rounded-lg bg-zinc-900 border border-slate-800 text-amber-400 font-mono text-xs font-bold">
                        {machine.workOrder}
                      </span>
                    </div>

                    <h3 className="text-sm sm:text-base font-extrabold text-white mt-3">
                      {machine.nombre} ({machine.id})
                    </h3>
                    <p className="text-xs text-rose-200 mt-1 leading-relaxed">
                      <strong>Causa del Bloqueo:</strong> {machine.motivoBloqueo}
                    </p>
                  </div>

                  <div className="pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
                    <span className="text-[11px] font-mono text-slate-400 truncate">
                      Bloqueado: {machine.fechaBloqueo}
                    </span>
                    <button
                      type="button"
                      onClick={(e) => {
                        e.stopPropagation();
                        setSelectedLockedId(machine.id);
                        setIsReleaseModalOpen(true);
                      }}
                      className="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-extrabold inline-flex items-center gap-1.5 shrink-0"
                    >
                      <Unlock className="w-3.5 h-3.5" />
                      Liberar Unidad
                    </button>
                  </div>
                </div>

          </div>

        {/* Lista resumida del resto de la flota */}
        <div className="pt-2">
          <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
            Resumen General de Unidades:
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            {machines.map((m) => (
              <div
                key={m.id}
                className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between text-xs"
              >
                <div>
                  <div className="font-bold text-white">{m.nombre}</div>
                  <div className="font-mono text-[11px] text-slate-400">{m.id}</div>
                </div>
                {m.estado === 'BLOQUEADO_LOTO' ? (
                  <span className="px-2 py-0.5 rounded-lg bg-rose-600/20 text-rose-400 border border-rose-500/40 font-mono font-bold text-[10px]">
                    BLOQUEADO
                  </span>
                ) : (
                  <span className="px-2 py-0.5 rounded-lg bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 font-bold text-[10px]">

              2. Registro Histórico de Liberaciones LOTO
            </h2>
          </div>
          <span className="text-xs font-mono text-slate-400">
            Trazabilidad con doble firma auditable
          </span>
        </div>

        <div className="space-y-3">
          {lotoHistory.map((item) => (

              key={item.id}
              className="p-4 rounded-xl bg-slate-950 border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs"
            >
              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <span className="font-mono font-bold text-amber-400">{item.id}</span>
                  <span className="text-white font-bold">{item.maquinaNombre} ({item.maquinaId})</span>
                  <span className="px-2 py-0.5 rounded bg-zinc-900 border border-slate-800 font-mono text-[11px] text-slate-300">
                    {item.lotoCode} • {item.workOrder}
                  </span>
                </div>
                <div className="text-slate-400 text-[11px]">
                  Liberado: <strong className="text-slate-200">{item.fechaLiberacion}</strong> • Causa original: {item.motivoOriginal}

              </div>

              <div className="flex items-center gap-3 shrink-0">
                <div className="text-right text-[11px] font-mono text-slate-300">
                  <div>Mecánico: {item.aprobadoMantenimiento}</div>
                  <div>HSE: {item.aprobadoHSE}</div>
                </div>
                <span className="px-2.5 py-1 rounded-lg bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 font-bold text-[11px]">
                  OPERATIVO
                </span>

                <Unlock className="w-5 h-5 text-emerald-400 shrink-0" />

                  Paso 1: Verificaciones Físicas Obligatorias

                  type="button"
                  onClick={handleAutoFillReleaseDemo}
                  className="px-2.5 py-1 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 text-amber-400 border border-amber-500/30 font-bold text-[10px] inline-flex items-center gap-1"
                >
                  <Sparkles className="w-3 h-3" />
                  Marcar Todo (Demo)
                </button>
              </div>

              <div
                onClick={() => setChecks({ ...checks, piezaReemplazada: !checks.piezaReemplazada })}
                className={`p-3 rounded-xl border cursor-pointer text-xs transition-all flex items-center justify-between gap-3 ${
                  checks.piezaReemplazada
                    ? 'bg-emerald-500/15 border-emerald-500/40 text-white font-semibold'
                    : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                }`}
              >
                <span>[1] Pieza defectuosa reemplazada y fuga subsanada</span>
                <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold shrink-0 ${checks.piezaReemplazada ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                  {checks.piezaReemplazada ? 'Verificado' : 'Pendiente'}
                </span>
              </div>

              <div
                onClick={() => setChecks({ ...checks, retiroCandado: !checks.retiroCandado })}
                className={`p-3 rounded-xl border cursor-pointer text-xs transition-all flex items-center justify-between gap-3 ${
                  checks.retiroCandado
                    ? 'bg-emerald-500/15 border-emerald-500/40 text-white font-semibold'
                    : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                }`}
              >
                <span>[2] Retiro físico del candado rojo y etiqueta LOTO</span>
                <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold shrink-0 ${checks.retiroCandado ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                  {checks.retiroCandado ? 'Verificado' : 'Pendiente'}
                </span>
              </div>

              <div
                onClick={() => setChecks({ ...checks, pruebaFrenos: !checks.pruebaFrenos })}
                className={`p-3 rounded-xl border cursor-pointer text-xs transition-all flex items-center justify-between gap-3 ${
                  checks.pruebaFrenos
                    ? 'bg-emerald-500/15 border-emerald-500/40 text-white font-semibold'
                    : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                }`}
              >
                <span>[3] Prueba funcional de frenos y parada de emergencia al 100%</span>
                <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold shrink-0 ${checks.pruebaFrenos ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                  {checks.pruebaFrenos ? 'Verificado' : 'Pendiente'}
                </span>
              </div>
            </div>

            {/* Paso 2: Doble firma en 1 clic */}
            <div className="space-y-2 pt-1 border-t border-slate-800">
              <span className="font-bold text-white uppercase text-xs block">
                Paso 2: Doble Firma de Aprobación
              </span>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div
                  onClick={() => setAprobadoMantenimiento(!aprobadoMantenimiento)}
                  className={`p-3 rounded-xl border cursor-pointer transition-all flex items-center justify-between gap-2 ${
                    aprobadoMantenimiento
                      ? 'bg-emerald-500/15 border-emerald-500/40 text-white font-semibold'
                      : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                  }`}
                >
                  <div className="truncate">
                    <div className="font-bold text-amber-400">1ª Firma: Mantenimiento</div>
                    <div className="text-[11px] text-slate-400 truncate">{firmaMantenimiento}</div>
                  </div>
                  <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold shrink-0 ${aprobadoMantenimiento ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                    {aprobadoMantenimiento ? 'Firmado' : 'Firmar'}
                  </span>
                </div>

                <div
                  onClick={() => setAprobadoHSE(!aprobadoHSE)}
                  className={`p-3 rounded-xl border cursor-pointer transition-all flex items-center justify-between gap-2 ${
                    aprobadoHSE
                      ? 'bg-emerald-500/15 border-emerald-500/40 text-white font-semibold'
                      : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                  }`}
                >
                  <div className="truncate">
                    <div className="font-bold text-emerald-400">2ª Firma: Supervisor HSE</div>
                    <div className="text-[11px] text-slate-400 truncate">{firmaHSE}</div>
                  </div>
                  <span className={`px-2 py-0.5 rounded text-[10px] font-extrabold shrink-0 ${aprobadoHSE ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                    {aprobadoHSE ? 'Firmado' : 'Firmar'}
                  </span>
                </div>
              </div>
            </div>

            {/* Dictamen */}
            <div className="pt-1">
              <label className="block text-xs font-semibold text-slate-400 mb-1">
                Dictamen Técnico Final
              </label>
              <input
                type="text"
                value={notasTecnicasLiberacion}
                onChange={(e) => setNotasTecnicasLiberacion(e.target.value)}
                className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white"
              />
            </div>

            {/* Botón de confirmación final */}
            <div className="pt-2 border-t border-slate-800 flex items-center justify-between gap-2">
              <button
                type="button"
                onClick={() => setIsReleaseModalOpen(false)}
                className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold"
              >
                Cancelar
              </button>

              <button
                type="button"
                disabled={!allChecksComplete}
                onClick={handleConfirmRelease}
                className={`px-5 py-2.5 rounded-xl text-xs font-extrabold uppercase tracking-wider transition-all ${
                  allChecksComplete
                    ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-lg cursor-pointer'
                    : 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed opacity-60'
                }`}
              >
                {allChecksComplete
                  ? `Desbloquear y Retornar a Operativo`
                  : 'Complete las 3 revisiones y 2 firmas'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function resolveInitialPage() {
  if (typeof window === 'undefined') return 'home';
  if (window.__INITIAL_PAGE__ && PAGE_ROUTES[window.__INITIAL_PAGE__]) {
    return window.__INITIAL_PAGE__;
  }
  const path = window.location.pathname.toLowerCase();
  if (path.includes('normativa')) return 'normativa';
  if (path.includes('inspecciones')) return 'inspecciones';
  if (path.includes('riesgos')) return 'riesgos';
  if (path.includes('monitoreo')) return 'monitoreo';
  if (path.includes('capacitacion')) return 'capacitacion';
  if (path.includes('liberacion-loto') || path.includes('loto')) return 'loto';
  return 'home';
}

      if (y > 90) {
        setIsScrolled(true);
        setIsMenuCollapsed(true);
      } else {
        setIsScrolled(false);
        setIsMenuCollapsed(false);
      }
    };

    return () => window.removeEventListener('scroll', handleScroll);

    const target = PAGE_ROUTES[resolvedKey] || PAGE_ROUTES.home;

        window.history.pushState({ page: resolvedKey }, '', target.path);

                borderTopRightRadius: '3rem'}}
            >
              <div className="max-w-4xl mx-auto px-4">
                <div className="inline-block">
                  <h2
                    className="altgage-serif"
                    style={{ fontSize: 'clamp(2.5rem, 5vw, 4.25rem)', color: 'var(--color-dark)'}}
                  >
                    Comenzar Recorrido Guiado
                  </h2>
                  <div className="mega-btn-line mx-auto" />
                </div>
                <p className="text-lg font-bold mt-4" style={{ color: 'var(--color-dark)'}}>
                  Prueba el flujo completo de seguridad en menos de 2 minutos →
                </p>
              </div>
            </section>
          </div>
        ) : (
          /* =================================================================
             VISTA DE PÁGINA INDIVIDUAL (01 A 06)
             ================================================================= */
          <div className="max-w-[1440px] mx-auto px-4 sm:px-8 py-4 space-y-6">
            {/* Renderizado de la Página Activa con Props Exactos */}
            <div className="py-2">
              {currentPage === 'normativa'&& (
                <Module1Normativa
                  regulatoryAlerts={regulatoryAlerts}
                  setRegulatoryAlerts={setRegulatoryAlerts}
                  audits={audits}
                  setAudits={setAudits}
                  addNotification={addNotification}
                />
              )}

              {currentPage === 'inspecciones'&& (
                <Module2Checklists
                  machines={machines}
                  setMachines={setMachines}
                  checklistLogs={checklistLogs}
                  setChecklistLogs={setChecklistLogs}
                  workers={workers}
                  setWorkers={setWorkers}
                  activeWorkerId={activeWorkerId}
                  setActiveWorkerId={setActiveWorkerId}
                  addNotification={addNotification}
                  setActiveTab={navigateToPage}
                  triggerIoTAlertFromChecklist={() => setIotForceAlert(true)}
                />
              )}

              {currentPage === 'riesgos'&& (
                <Module3Riesgos
                  riskReports={riskReports}
                  setRiskReports={setRiskReports}
                  machines={machines}
                  setMachines={setMachines}
                  addNotification={addNotification}
                  setActiveTab={navigateToPage}
                />
              )}

              {currentPage === 'monitoreo'&& (
                <Module4IoT
                  machines={machines}
                  riskReports={riskReports}
                  iotForceAlert={iotForceAlert}
                  setIotForceAlert={setIotForceAlert}
                  addNotification={addNotification}
                  setActiveTab={navigateToPage}
                />
              )}

              {currentPage === 'capacitacion'&& (
                <Module5Capacitacion
                  courses={activeWorkerCourses}
                  setCourses={handleUpdateActiveWorkerCourses}
                  workers={workers}
                  setWorkers={setWorkers}
                  activeWorkerId={activeWorkerId}
                  setActiveWorkerId={setActiveWorkerId}
                  userCoursesMap={userCoursesMap}
                  setUserCoursesMap={setUserCoursesMap}
                  certificates={certificates}
                  setCertificates={setCertificates}
                  addNotification={addNotification}
                />
              )}

              {currentPage === 'loto'&& (
                <Module6Loto
                  machines={machines}
                  setMachines={setMachines}
                  lotoHistory={lotoHistory}
                  setLotoHistory={setLotoHistory}
                  setIotForceAlert={setIotForceAlert}
                  addNotification={addNotification}
                  setActiveTab={navigateToPage}
                />
              )}
            </div>

            {/* Paginación Inferior entre páginas */}
            <div
              className="rounded-3xl p-6 flex flex-wrap items-center justify-between gap-4 border-2"
              style={{ backgroundColor: '#ffffff', borderColor: '#a4f0d0'}}
            >
              <div>
                {prevPageKey ? (
                  <AltgageButton theme="light" onClick={() => navigateToPage(prevPageKey)}>
                    <span>← Anterior: {PAGE_ROUTES[prevPageKey].title}</span>
                  </AltgageButton>
                ) : (
                  <span />
                )}
              </div>
              <div className="text-xs font-bold" style={{ color: '#5c3178'}}>
                Página {activeRouteInfo.num} de 06 • Datos sincronizados automáticamente
              </div>
              <div>
                {nextPageKey ? (
                  <AltgageButton theme="primary" onClick={() => navigateToPage(nextPageKey)}>
                    <span>Siguiente: {PAGE_ROUTES[nextPageKey].title} →</span>
                  </AltgageButton>
                ) : (
                  <AltgageButton theme="mint" onClick={() => navigateToPage('home')}>
                    <span>Volver a Portada Principal →</span>
                  </AltgageButton>
                )}
              </div>
            </div>
          </div>
        )}
      </main>

      {/* =====================================================================
          FOOTER ESTILO ALTGAGE (FONDO PURPLE PROFUNDO #4D1D6A + TARJETAS INFERIORES)
          ===================================================================== */}
      <footer
        className="pt-14 pb-10 px-4 sm:px-8 mt-12"
        style={{ backgroundColor: 'var(--color-dark)', color: '#ffffff'}}
      >
        <div className="max-w-[1320px] mx-auto space-y-10">
          {/* 4 Tarjetas de Acceso Rápido estilo Footer de Altgage */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {[
              { title: 'Normativa 522-06', sub: 'Leyes y Vencimientos', key: 'normativa'},
              { title: 'Inspección Equipos', sub: 'Checklists Pre-Uso', key: 'inspecciones'},
              { title: 'Triaje de Riesgos', sub: 'Matriz Fine 3×3', key: 'riesgos'},
              { title: 'Protocolo LOTO', sub: 'Liberación Doble Firma', key: 'loto'}
            ].map((card) => (
              <div
                key={card.key}
                onClick={() => navigateToPage(card.key)}
                className="rounded-3xl p-5 cursor-pointer transition-transform hover:scale-[1.02]"
                style={{ backgroundColor: 'var(--color-secondary-700)', border: '1px solid #702987'}}
              >
                <div className="flex items-center justify-between mb-2">
                  <span className="altgage-serif text-lg" style={{ color: 'var(--color-primary-400)'}}>
                    {card.title}
                  </span>
                  <ArrowUpRight className="w-4 h-4" style={{ color: 'var(--color-primary-400)'}} />
                </div>
                <p className="text-xs opacity-80">{card.sub}</p>
              </div>
            ))}
          </div>

          <div className="pt-6 border-t flex flex-wrap items-center justify-between gap-4 text-xs" style={{ borderColor: '#702987'}}>
            <div>
              <strong style={{ color: 'var(--color-primary-400)'}}>SafeWork 4.0 — TECIROMAQ Santo Domingo</strong> •
              Plataforma de Seguridad y Salud Ocupacional (Decreto 522-06 / ISO 45001)
            </div>
            <button
              onClick={handleResetDemo}
              className="underline font-bold flex items-center gap-1"
              style={{ color: 'var(--color-primary-400)'}}
            >
              <RotateCcw className="w-3.5 h-3.5" /> Restaurar Datos de Demostración
            </button>
          </div>
        </div>
      </footer>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));

  </script>
</body>
</html>
